name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
    - main
    - master

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          # Personal token is required to aggregate language data from private repos.
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Add private C# and Dart activity to the language chart
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: node scripts/boost-private-languages.mjs
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "generated 3d contrib"
          git push
